# .air.toml
# Configuration for air live reload tool: https://github.com/cosmtrek/air

# Working directory
# . or absolute path, please note that the directories following must be under root.
root = "."
tmp_dir = "tmp" # Directory for temporary files generated by air

[build]
# Just plain old shell command. You could use `make` as well.
cmd = "make build" # Use make build to include version flags
# Binary file yields from `cmd`.
bin = "nimbus-service"
# Customize binary. Required if `cmd` does not produce the expected binary path.
# full_bin = "APP_ENV=dev APP_USER=air ./tmp/main"

# Watch these filename extensions.
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "env"]
# Ignore these filename extensions or directories.
exclude_dir = ["tmp", "vendor", "node_modules"]
# Watch these directories if you specified.
include_dir = ["cmd", "internal", "modules", "configs"]
# Exclude files.
exclude_file = []
# Exclude specific regular expressions.
exclude_regex = ["_test\.go"]
# Exclude unchanged files.
exclude_unchanged = false
# Follow symlink for directories
follow_symlink = true
# Log name
log = "air_errors.log"
# Poll interval (defaults to 500ms)
poll_interval = 500 # ms
# It's not necessary to trigger build each time file changes if it's too frequent.
delay = 1000 # ms
# Stop running old binary when build errors occur.
stop_on_error = true
# Send TERM signal to process instead of KILL when restarting.
send_interrupt = false
# Delay after sending TERM signal
kill_delay = 500 # ms

[log]
# Show log time
time = true

[color]
# Customize each part's color. If no color found, use the raw app log.
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
# Delete tmp directory on exit
clean_on_exit = true 